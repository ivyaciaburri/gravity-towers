<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Gravity Towers</title>
<style>
body {
  font-family: Arial, sans-serif;
  text-align: center;
  background: #f4f4f4;
  margin:0;
  padding:0;
}
#status {
  font-size: 18px;
  font-weight: bold;
  margin: 10px;
}
#board {
  display: grid;
  grid-template-columns: repeat(15, 40px);
  grid-template-rows: repeat(13, 40px);
  gap: 2px;
  margin: 20px auto;
  border: 2px solid #999;
  background: #fff;
  width: max-content;
}
.cell {
  width: 40px;
  height: 40px;
  background: #eee;
  position: relative;
}
.piece {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  color: white;
  font-weight: bold;
  display: flex;
  align-items: center;
  justify-content: center;
  position: absolute;
  top: 5px;
  left: 5px;
  cursor: pointer;
  transition: all 1.2s ease;
  z-index: 10;
}
.red { background: #d9534f; }
.blue { background: #0275d8; }
.neutral { background: #777; }

#modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  display: flex;
  align-items: center;
  justify-content: center;
}
#modalContent {
  background: white;
  padding: 20px;
  width: 420px;
  border-radius: 6px;
  text-align: left;
}
button { cursor:pointer; }
</style>
</head>
<body>

<h1>Gravity Towers</h1>
<div id="status"></div>
<div id="board"></div>

<div id="modal">
  <div id="modalContent">
    <h2>How to Play</h2>
    <ul>
      <li>Move one piece one square (including diagonals).</li>
      <li>Landing on another piece stacks mass.</li>
      <li>Towers (height ≥ 2) always have gravity and pull in nearby pieces.</li>
      <li>Captured pieces take the tower’s color.</li>
      <li>Game ends when all mass is in a single tower.</li>
    </ul>
    <button id="startGame">Start Game</button>
  </div>
</div>

<script>
window.onload = function(){
const WIDTH=15, HEIGHT=13;
let board=[], currentPlayer="red", selected=null, totalMass=0;
const boardDiv=document.getElementById("board");
const statusDiv=document.getElementById("status");

document.getElementById("startGame").onclick = ()=>{
  document.getElementById("modal").style.display="none";
  startGame();
};

function startGame(){
  board=Array.from({length:HEIGHT},()=>Array(WIDTH).fill(null));
  totalMass=0;
  placePieces("red");
  placePieces("blue");
  placePieces("neutral");
  currentPlayer="red";
  selected=null;
  updateStatus();
  render();
}

// place pieces with at least one empty square between
function placePieces(color){
  let n=0;
  while(n<5){
    let x=Math.floor(Math.random()*WIDTH);
    let y=Math.floor(Math.random()*HEIGHT);
    if(!board[y][x] && !adjacentOccupied(x,y)){
      board[y][x]={color,height:1};
      totalMass++;
      n++;
    }
  }
}

function adjacentOccupied(x,y){
  for(let dy=-1;dy<=1;dy++){
    for(let dx=-1;dx<=1;dx++){
      const nx=x+dx, ny=y+dy;
      if(nx<0||nx>=WIDTH||ny<0||ny>=HEIGHT) continue;
      if(board[ny][nx]) return true;
    }
  }
  return false;
}

function updateStatus(){
  statusDiv.textContent=currentPlayer.toUpperCase()+"'s Turn";
}

function render(){
  boardDiv.innerHTML="";
  for(let y=0;y<HEIGHT;y++){
    for(let x=0;x<WIDTH;x++){
      const cell=document.createElement("div");
      cell.className="cell";
      boardDiv.appendChild(cell);
      const p=board[y][x];
      if(p){
        const piece=document.createElement("div");
        piece.className="piece "+p.color;
        piece.textContent=p.height;
        piece.onclick=()=>handleClick(x,y);
        cell.appendChild(piece);
      }
    }
  }
}

function canMove(x1,y1,x2,y2){
  return Math.max(Math.abs(x1-x2),Math.abs(y1-y2))===1;
}

function handleClick(x,y){
  const piece=board[y][x];
  if(!selected){
    if(piece && piece.color===currentPlayer) selected={x,y};
    return;
  }
  if(!canMove(selected.x,selected.y,x,y)){
    selected=null; render(); return;
  }
  executeMove(selected.x,selected.y,x,y);
}

function executeMove(x1,y1,x2,y2){
  const mover=board[y1][x1];
  const target=board[y2][x2];
  board[y1][x1]=null;
  selected=null;

  if(target){ mover.height += target.height; }

  board[y2][x2]=mover;
  render();

  // gravity resolves after move
  const animations = resolveGravity();
  playAnimationsSequentially(animations,endTurn);
}

// resolve gravity pulls recursively
function resolveGravity(){
  const animations=[];
  let changed=true;
  while(changed){
    changed=false;
    for(let y=0;y<HEIGHT;y++){
      for(let x=0;x<WIDTH;x++){
        const tower=board[y][x];
        if(!tower || tower.height<2) continue;
        const range = tower.height-1;
        for(let yy=0;yy<HEIGHT;yy++){
          for(let xx=0;xx<WIDTH;xx++){
            if(xx===x && yy===y) continue;
            const piece=board[yy][xx];
            if(!piece) continue;
            const dist=Math.max(Math.abs(xx-x),Math.abs(yy-y));
            if(dist<=range){
              animations.push({from:{x:xx,y:yy},to:{x,y},target:piece,mover:tower});
              tower.height += piece.height;
              board[yy][xx]=null;
              changed=true;
            }
          }
        }
      }
    }
  }
  return animations;
}

function playAnimationsSequentially(list,done){
  if(list.length===0){ render(); done(); return; }
  let i=0;
  function next(){
    if(i>=list.length){ render(); done(); return; }
    const anim=list[i]; i++;
    const fromCell = boardDiv.children[anim.from.y*WIDTH+anim.from.x];
    const toCell = boardDiv.children[anim.to.y*WIDTH+anim.to.x];
    const temp = document.createElement("div");
    temp.className="piece "+anim.target.color;
    temp.textContent=anim.target.height;
    document.body.appendChild(temp);
    const fromRect = fromCell.getBoundingClientRect();
    const toRect = toCell.getBoundingClientRect();
    temp.style.position="fixed";
    temp.style.left=fromRect.left+5+"px";
    temp.style.top=fromRect.top+5+"px";

    const dist = Math.max(Math.abs(anim.to.x-anim.from.x),Math.abs(anim.to.y-anim.from.y));
    const duration = 1.2 + dist*1.2;

    requestAnimationFrame(()=>{
      temp.style.transition=`all ${duration}s ease`;
      temp.style.left=toRect.left+5+"px";
      temp.style.top=toRect.top+5+"px";
    });

    temp.ontransitionend=()=>{
      document.body.removeChild(temp);
      next();
    };
  }
  next();
}

function endTurn(){
  if(checkWin()) return;
  let nextPlayer=currentPlayer==="red"?"blue":"red";
  if(!playerHasPieces(nextPlayer)) nextPlayer=currentPlayer;
  currentPlayer=nextPlayer;
  updateStatus();
  render();
}

function playerHasPieces(color){
  for(const r of board) for(const c of r) if(c && c.color===color) return true;
  return false;
}

function checkWin(){
  let pieces=0,lastPiece=null;
  for(const r of board) for(const c of r) if(c){ pieces++; lastPiece=c; }
  if(pieces===1 && lastPiece.height===totalMass){
    statusDiv.textContent = lastPiece.color.toUpperCase()+" WINS!";
    return true;
  }
  return false;
}
};
</script>
</body>
</html>
