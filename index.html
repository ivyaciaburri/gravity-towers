<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Gravity Towers</title>

<style>
body { font-family: Arial, sans-serif; text-align:center; background:#f4f4f4; }
#status { font-size:18px; font-weight:bold; margin:10px; }
#board {
  display:grid;
  grid-template-columns:repeat(13,40px);
  gap:2px;
  justify-content:center;
  margin:20px auto;
}
.cell {
  width:40px; height:40px;
  border:1px solid #999;
  background:white;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
}
.highlightMove { background:#d0ebff; }
.highlightCapture { background:#ffeb99; }

.piece {
  width:30px; height:30px;
  border-radius:50%;
  color:white; font-weight:bold;
  display:flex; align-items:center; justify-content:center;
  position:absolute;
  transition: transform 0.6s ease-in;
}
.red{background:#d9534f;}
.blue{background:#0275d8;}
.neutral{background:#777;}

#modal {
  position:fixed; inset:0;
  background:rgba(0,0,0,.6);
  display:flex; align-items:center; justify-content:center;
}
#modalContent {
  background:white; padding:20px;
  width:420px; border-radius:6px;
  text-align:left;
}
</style>
</head>

<body>

<h1>Gravity Towers</h1>
<div id="status"></div>
<div id="board"></div>

<div id="modal">
  <div id="modalContent">
    <h2>How to Play</h2>
    <ul>
      <li>Move one piece one square.</li>
      <li>Stacks add mass.</li>
      <li>Towers have gravity at all times.</li>
      <li>Entering gravity causes capture.</li>
      <li>Final consolidated tower wins.</li>
    </ul>
    <button id="startGame">Start Game</button>
  </div>
</div>

<script>
const W=13,H=15;
let board=[], current="red", selected=null;
let totalMass=0;

const boardDiv=document.getElementById("board");
const statusDiv=document.getElementById("status");

document.getElementById("startGame").onclick=()=>{
  document.getElementById("modal").style.display="none";
  start();
};

function start(){
  board=Array.from({length:H},()=>Array(W).fill(null));
  totalMass=0;
  place("red"); place("blue"); place("neutral");
  current="red"; selected=null;
  render(); update();
}

function place(color){
  let n=0;
  while(n<5){
    let x=Math.random()*W|0,y=Math.random()*H|0;
    if(board[y][x]) continue;
    board[y][x]={color,height:1};
    totalMass++; n++;
  }
}

function update(){
  statusDiv.textContent=current.toUpperCase()+"'s Turn";
}

function render(){
  boardDiv.innerHTML="";
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const c=document.createElement("div");
    c.className="cell";
    if(selected && canMove(selected.x,selected.y,x,y))
      c.classList.add("highlightMove");
    const p=board[y][x];
    if(p){
      const d=document.createElement("div");
      d.className=`piece ${p.color}`;
      d.textContent=p.height;
      c.appendChild(d);
    }
    c.onclick=()=>click(x,y);
    boardDiv.appendChild(c);
  }
}

function click(x,y){
  const p=board[y][x];
  if(!selected){
    if(p && p.color===current) selected={x,y};
    render(); return;
  }
  if(!canMove(selected.x,selected.y,x,y)){
    selected=null; render(); return;
  }
  move(selected.x,selected.y,x,y);
}

function canMove(x1,y1,x2,y2){
  return Math.max(Math.abs(x1-x2),Math.abs(y1-y2))===1;
}

function move(x1,y1,x2,y2){
  const mover=board[y1][x1];
  const target=board[y2][x2];
  board[y1][x1]=null;
  board[y2][x2]=mover;
  if(target) mover.height+=target.height;
  selected=null;

  const animations = resolveGravity();
  render();
  playAnimations(animations, endTurn);
}

function resolveGravity(){
  let animations=[];
  let changed=true;
  while(changed){
    changed=false;
    for(let y=0;y<H;y++)for(let x=0;x<W;x++){
      const t=board[y][x];
      if(!t||t.height<2) continue;
      const r=t.height-1;
      for(let yy=0;yy<H;yy++)for(let xx=0;xx<W;xx++){
        const p=board[yy][xx];
        if(!p||(xx===x&&yy===y)) continue;
        if(Math.max(Math.abs(xx-x),Math.abs(yy-y))<=r){
          animations.push({from:{x:xx,y:yy},to:{x,y}});
          t.height+=p.height;
          board[yy][xx]=null;
          changed=true;
        }
      }
    }
  }
  return animations;
}

function playAnimations(list,done){
  if(!list.length){ done(); return; }
  let finished=0;
  list.forEach(a=>{
    const from=a.from,to=a.to;
    const idx=from.y*W+from.x;
    const el=boardDiv.children[idx].querySelector(".piece");
    if(!el){ finished++; return; }
    const dx=(to.x-from.x)*42;
    const dy=(to.y-from.y)*42;
    el.style.transform=`translate(${dx}px,${dy}px) scale(0.1)`;
    el.ontransitionend=()=>{
      finished++;
      if(finished===list.length) done();
    };
  });
}

function endTurn(){
  if(checkWin()) return;
  current=current==="red"?"blue":"red";
  update(); render();
}

function checkWin(){
  let pieces=0, tower=null;
  for(let r of board)for(let c of r) if(c){ pieces++; tower=c; }
  if(pieces===1 && tower.height===totalMass){
    statusDiv.textContent=tower.color.toUpperCase()+" WINS!";
    return true;
  }
  return false;
}
</script>

</body>
</html>
